apiVersion: apps/v1
kind: Deployment
metadata:
  name: sg-events-app
  labels:
    app: sg-events-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sg-events-app
  template:
    metadata:
      labels:
        app: sg-events-app
    spec:
      containers:
        - name: sg-events-app
          image: abhishek892/sg-events-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
      # imagePullSecrets:
      # - name: dockerhub-secret
